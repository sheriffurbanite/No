<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>No-Gen | Live Engine</title>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #172554, #070b14 45%, #020308);
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 900;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      font-size: 10px;
      color: #8490a8;
      margin-top: 3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #94a3b8;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .status.online .dot {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .status.offline .dot {
      background: #ef4444;
    }

    /* MAIN CARD */

    .card {
      background: rgba(12, 18, 32, .96);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,.45);
    }

    /* NUMBER REQUEST */

    .request-section {
      text-align: center;
    }

    .section-label {
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    .number-display {
      min-height: 95px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);
      margin-bottom: 14px;
    }

    .number-display span {
      font-size: 52px;
      font-weight: 900;
    }

    .number-display.waiting span {
      color: #475569;
      font-size: 34px;
    }

    .number-display.generated {
      animation: numberPop .3s ease;
    }

    @keyframes numberPop {
      0% {
        transform: scale(.8);
        opacity: .3;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* INPUTS */

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    label {
      display: block;
      text-align: left;
      color: #64748b;
      font-size: 10px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.08);
      outline: none;
      background: #080d17;
      color: white;
      font-size: 14px;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: white;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* DIVIDER */

    .divider {
      height: 1px;
      background: rgba(255,255,255,.07);
      margin: 22px 0;
    }

    /* LIVE ENGINE */

    .live-section {
      text-align: center;
    }

    .phase {
      color: #94a3b8;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .multiplier {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -4px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      color: transparent;
    }

    .timer {
      min-height: 48px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
      color: #cbd5e1;
      font-size: 20px;
      font-weight: 800;
    }

    .round-id {
      margin-top: 10px;
      color: #475569;
      font-size: 9px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* HISTORY */

    .history-title {
      margin: 18px 0 9px;
      color: #94a3b8;
      font-size: 11px;
    }

    .history {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .history::-webkit-scrollbar {
      display: none;
    }

    .history-item {
      min-width: 70px;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
    }

    .history-item strong {
      font-size: 12px;
    }

    .history-item small {
      display: block;
      margin-top: 3px;
      color: #475569;
      font-size: 8px;
    }

    .footer {
      text-align: center;
      color: #475569;
      font-size: 9px;
      margin-top: 15px;
    }

    @media (max-width: 380px) {
      .card {
        padding: 15px;
      }

      .multiplier {
        font-size: 55px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header>

    <div class="brand">

      <div class="logo">
        NG
      </div>

      <div>
        <h1>No-Gen</h1>
        <p>Real-Time Number Engine</p>
      </div>

    </div>

    <div id="status" class="status">

      <span class="dot"></span>

      <span id="statusText">
        Connecting
      </span>

    </div>

  </header>


  <div class="card">

    <!-- ==========================================
         NUMBER REQUEST
    =========================================== -->

    <section class="request-section">

      <div class="section-label">
        Requested Number
      </div>

      <div
        id="numberDisplay"
        class="number-display waiting"
      >

        <span id="generatedNumber">
          —
        </span>

      </div>


      <div class="inputs">

        <div>
          <label for="min">
            MINIMUM
          </label>

          <input
            id="min"
            type="number"
            value="1"
          >
        </div>

        <div>
          <label for="max">
            MAXIMUM
          </label>

          <input
            id="max"
            type="number"
            value="100"
          >
        </div>

      </div>


      <button id="generateBtn">
        REQUEST NUMBER
      </button>

    </section>


    <div class="divider"></div>


    <!-- ==========================================
         LIVE ENGINE
    =========================================== -->

    <section class="live-section">

      <div
        id="phase"
        class="phase"
      >
        WAITING
      </div>


      <div
        id="multiplier"
        class="multiplier"
      >
        1.00x
      </div>


      <div
        id="timer"
        class="timer"
      >
        —
      </div>


      <div
        id="roundId"
        class="round-id"
      >
        No active round
      </div>

    </section>


    <!-- HISTORY -->

    <div class="history-title">
      RECENT ROUNDS
    </div>

    <div
      id="history"
      class="history"
    ></div>

  </div>


  <div class="footer">
    No-Gen • Socket.IO Real-Time Engine
  </div>

</div>


<script>

  /* =====================================================
     CONFIG
  ===================================================== */

  const BACKEND_URL =
    "https://no-gen.bonto.run";


  /* =====================================================
     SOCKET
  ===================================================== */

  const socket = io(
    BACKEND_URL,
    {
      transports: [
        "websocket",
        "polling"
      ],

      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000
    }
  );


  /* =====================================================
     STATE
  ===================================================== */

  let connected = false;

  let phase = "waiting";

  let currentRoundId = null;

  let currentMultiplier = 1;

  let history = [];


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const status =
    document.getElementById("status");

  const statusText =
    document.getElementById("statusText");

  const numberDisplay =
    document.getElementById("numberDisplay");

  const generatedNumber =
    document.getElementById("generatedNumber");

  const generateBtn =
    document.getElementById("generateBtn");

  const minInput =
    document.getElementById("min");

  const maxInput =
    document.getElementById("max");

  const phaseElement =
    document.getElementById("phase");

  const multiplierElement =
    document.getElementById("multiplier");

  const timerElement =
    document.getElementById("timer");

  const roundIdElement =
    document.getElementById("roundId");

  const historyElement =
    document.getElementById("history");


  /* =====================================================
     CONNECTION
  ===================================================== */

  socket.on("connect", () => {

    connected = true;

    status.classList.add("online");
    status.classList.remove("offline");

    statusText.textContent =
      "Connected";

  });


  socket.on("disconnect", () => {

    connected = false;

    status.classList.remove("online");
    status.classList.add("offline");

    statusText.textContent =
      "Disconnected";

  });


  socket.on(
    "connect_error",
    () => {

      connected = false;

      status.classList.remove("online");
      status.classList.add("offline");

      statusText.textContent =
        "Connection error";

    }
  );


  /* =====================================================
     NUMBER REQUEST
     
     IMPORTANT:
     This operates independently from the live engine.
  ===================================================== */

  generateBtn.addEventListener(
    "click",
    () => {

      if (!connected) {

        generatedNumber.textContent =
          "OFF";

        return;
      }


      const min =
        Number(minInput.value);

      const max =
        Number(maxInput.value);


      if (
        !Number.isInteger(min) ||
        !Number.isInteger(max) ||
        min > max
      ) {

        generatedNumber.textContent =
          "ERR";

        return;
      }


      generateBtn.disabled = true;

      generateBtn.textContent =
        "REQUESTING...";


      /*
        The request is sent immediately.

        It does NOT wait for the countdown.
        It does NOT depend on the multiplier.
      */

      socket.emit(
        "generate_number",
        {
          min,
          max
        }
      );

    }
  );


  /* =====================================================
     NUMBER RECEIVED
     
     NUMBER IS DISPLAYED FIRST.
  ===================================================== */

  socket.on(
    "number_generated",
    (data) => {

      generatedNumber.textContent =
        data.number;


      numberDisplay.classList.remove(
        "generated"
      );

      /*
        Force animation restart.
      */

      void numberDisplay.offsetWidth;


      numberDisplay.classList.remove(
        "waiting"
      );

      numberDisplay.classList.add(
        "generated"
      );


      generateBtn.disabled = false;

      generateBtn.textContent =
        "REQUEST NUMBER";


      /*
        The live round is NOT started
        by this event.

        The server controls the live
        round independently.
      */

    }
  );


  /* =====================================================
     NUMBER ERROR
  ===================================================== */

  socket.on(
    "generation_error",
    (data) => {

      generatedNumber.textContent =
        "ERR";

      generateBtn.disabled = false;

      generateBtn.textContent =
        "REQUEST NUMBER";

      console.error(
        data?.message
      );

    }
  );


  /* =====================================================
     SERVER ROUND STATE
  ===================================================== */

  socket.on(
    "round_state",
    (data) => {

      if (!data) return;

      phase =
        data.phase || "waiting";

      currentRoundId =
        data.roundId || null;

      currentMultiplier =
        Number(data.multiplier) || 1;

      updateLiveUI();

    }
  );


  /* =====================================================
     COUNTDOWN
  ===================================================== */

  socket.on(
    "round_countdown",
    (data) => {

      phase = "countdown";

      currentRoundId =
        data.roundId;

      currentMultiplier = 1;

      phaseElement.textContent =
        "NEXT ROUND";

      multiplierElement.textContent =
        "1.00x";

      timerElement.textContent =
        `${data.seconds}s`;

      updateRoundId();

    }
  );


  /* =====================================================
     ROUND START
  ===================================================== */

  socket.on(
    "round_started",
    (data) => {

      phase = "running";

      currentRoundId =
        data.roundId;

      currentMultiplier =
        Number(data.multiplier) || 1;

      updateLiveUI();

    }
  );


  /* =====================================================
     LIVE MULTIPLIER
  ===================================================== */

  socket.on(
    "round_update",
    (data) => {

      phase = "running";

      currentRoundId =
        data.roundId;

      currentMultiplier =
        Number(data.multiplier) || 1;

      updateLiveUI();

    }
  );


  /* =====================================================
     ROUND ENDED
  ===================================================== */

  socket.on(
    "round_ended",
    (data) => {

      phase = "ended";

      currentRoundId =
        data.roundId;

      currentMultiplier =
        Number(data.multiplier) || 1;

      updateLiveUI();

      addHistory(
        currentRoundId,
        currentMultiplier
      );

    }
  );


  /* =====================================================
     LIVE UI
  ===================================================== */

  function updateLiveUI() {

    if (phase === "countdown") {

      phaseElement.textContent =
        "NEXT ROUND";

      timerElement.textContent =
        "WAITING";

    }

    else if (phase === "running") {

      phaseElement.textContent =
        "LIVE";

      timerElement.textContent =
        "RUNNING";

    }

    else if (phase === "ended") {

      phaseElement.textContent =
        "ROUND ENDED";

      timerElement.textContent =
        "WAITING";

    }

    else {

      phaseElement.textContent =
        "WAITING";

      timerElement.textContent =
        "—";

    }


    multiplierElement.textContent =
      `${currentMultiplier.toFixed(2)}x`;


    updateRoundId();

  }


  /* =====================================================
     ROUND ID
  ===================================================== */

  function updateRoundId() {

    if (!currentRoundId) {

      roundIdElement.textContent =
        "No active round";

      return;
    }


    roundIdElement.textContent =
      `Round ${currentRoundId.substring(0, 12)}`;

  }


  /* =====================================================
     HISTORY
  ===================================================== */

  function addHistory(
    id,
    multiplier
  ) {

    history.unshift({
      id,
      multiplier
    });


    if (history.length > 12) {
      history.pop();
    }


    renderHistory();

  }


  function renderHistory() {

    historyElement.innerHTML = "";


    history.forEach(
      (item) => {

        const element =
          document.createElement("div");

        element.className =
          "history-item";


        element.innerHTML = `
          <strong>
            ${item.multiplier.toFixed(2)}x
          </strong>

          <small>
            ${item.id.substring(0, 6)}
          </small>
        `;


        historyElement.appendChild(
          element
        );

      }
    );

  }


  /* =====================================================
     INITIAL
  ===================================================== */

  console.log(
    "No-Gen initialized"
  );

  console.log(
    "Backend:",
    BACKEND_URL
  );

</script>

</body>
    </html>
