<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO-GEN</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(circle at top,#1a1a1a,#070707 70%);
  color:#fff;
  font-family:system-ui,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}
.app{
  width:min(400px,94vw);
  background:#101010;
  border:1px solid #2a2a2a;
  border-radius:22px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.logo{font-size:20px;font-weight:900;letter-spacing:1px}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:#999}
.dot{width:8px;height:8px;border-radius:50%;background:#555}
.dot.on{background:#22e080;box-shadow:0 0 10px #22e080}

.signal-box{
  background:#171717;
  border:1px solid #2c2c2c;
  border-radius:16px;
  padding:14px;
  text-align:center;
  margin-bottom:14px;
}
.signal-label{font-size:11px;letter-spacing:2px;color:#777;margin-bottom:4px}
.signal-value{font-size:28px;font-weight:900}

.display{
  background:linear-gradient(160deg,#171717,#0b0b0b);
  border:1px solid #2a2a2a;
  border-radius:18px;
  min-height:200px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  margin-bottom:16px;
  padding:16px;
}
.phase{font-size:12px;letter-spacing:2px;color:#777;margin-bottom:8px}
.multiplier{font-size:56px;font-weight:900;line-height:1}
.multiplier.live{color:#7dffb3}
.multiplier.crash{color:#ff4d4d}
.timer{
  margin-top:10px;
  font-size:40px;
  font-weight:800;
  color:#ffcc66;
  min-height:48px;
}
.guide{margin-top:10px;font-size:13px;color:#888;text-align:center}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  background:#fff;
  color:#000;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}
button:active{transform:scale(.98)}

.message{
  margin-top:12px;
  text-align:center;
  font-size:13px;
  color:#888;
  min-height:18px;
}
.round-id{
  margin-top:8px;
  text-align:center;
  font-size:11px;
  color:#555;
  letter-spacing:1px;
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">NO-GEN</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </div>

  <div class="signal-box">
    <div class="signal-label">YOUR SIGNAL</div>
    <div class="signal-value" id="signal">—</div>
  </div>

  <div class="display">
    <div class="phase" id="phase">WAITING</div>
    <div class="multiplier" id="multiplier">1.00x</div>
    <div class="timer" id="timer"></div>
    <div class="guide" id="guide">Rounds run automatically</div>
  </div>

  <!-- Button is NEVER disabled -->
  <button id="btn">REQUEST SIGNAL</button>

  <div class="message" id="msg">Waiting for server...</div>
  <div class="round-id" id="roundId">NO ACTIVE ROUND</div>
</div>

<script>
const BACKEND = "https://no-gen.bonto.run";
const socket = io(BACKEND, {
  transports: ["websocket", "polling"],
  reconnection: true,
  reconnectionAttempts: Infinity
});

const dot     = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const signalEl = document.getElementById("signal");
const phaseEl  = document.getElementById("phase");
const multiEl  = document.getElementById("multiplier");
const timerEl  = document.getElementById("timer");
const guideEl  = document.getElementById("guide");
const msgEl    = document.getElementById("msg");
const roundEl  = document.getElementById("roundId");
const btn      = document.getElementById("btn");

socket.on("connect", () => {
  dot.classList.add("on");
  statusText.textContent = "Connected";
  msgEl.textContent = "Connected";
  socket.emit("get_round_state");
});

socket.on("disconnect", () => {
  dot.classList.remove("on");
  statusText.textContent = "Disconnected";
  msgEl.textContent = "Reconnecting...";
});

socket.on("connect_error", () => {
  dot.classList.remove("on");
  statusText.textContent = "Connection error";
  msgEl.textContent = "Cannot reach backend";
});

/* Button always works – never disabled */
btn.onclick = () => {
  msgEl.textContent = "Requesting signal...";
  socket.emit("request_prediction");
};

/* Server gives signal (only if round not crashed yet) */
socket.on("prediction_ready", (data) => {
  signalEl.textContent = data.prediction + "x";
  roundEl.textContent = "ROUND " + data.roundId;
  msgEl.textContent = "Signal received";
  guideEl.textContent = "Prediction locked for this round";
});

socket.on("prediction_error", (data) => {
  msgEl.textContent = data?.message || "No signal right now";
  guideEl.textContent = "Wait for the next countdown";
});

/* Timer during countdown */
socket.on("round_countdown", (data) => {
  phaseEl.textContent = "COUNTDOWN";
  multiEl.textContent = "1.00x";
  multiEl.className = "multiplier";
  timerEl.textContent = data.seconds;          // show timer
  guideEl.textContent = "Round starts in " + data.seconds + "s";
  roundEl.textContent = "ROUND " + data.roundId;
  msgEl.textContent = "Get ready";
});

/* Live */
socket.on("round_started", () => {
  phaseEl.textContent = "LIVE";
  timerEl.textContent = "";
  multiEl.textContent = "1.00x";
  multiEl.className = "multiplier live";
  guideEl.textContent = "Multiplier climbing...";
  msgEl.textContent = "Round is live – you can still request signal";
});

socket.on("round_update", (data) => {
  multiEl.textContent = Number(data.multiplier).toFixed(2) + "x";
  multiEl.className = "multiplier live";
});

/* Crashed */
socket.on("round_ended", (data) => {
  phaseEl.textContent = "CRASHED";
  multiEl.textContent = Number(data.multiplier).toFixed(2) + "x";
  multiEl.className = "multiplier crash";
  signalEl.textContent = Number(data.prediction).toFixed(2) + "x";
  timerEl.textContent = "";
  guideEl.textContent = "Crashed at " + Number(data.prediction).toFixed(2) + "x";
  msgEl.textContent = "Round finished – next round coming";
  roundEl.textContent = "ROUND " + data.roundId;
});

/* Next round about to start */
socket.on("round_reset", () => {
  phaseEl.textContent = "WAITING";
  multiEl.textContent = "1.00x";
  multiEl.className = "multiplier";
  signalEl.textContent = "—";
  timerEl.textContent = "";
  guideEl.textContent = "Next round starting soon";
  msgEl.textContent = "Ready";
  roundEl.textContent = "NO ACTIVE ROUND";
});

socket.on("round_state", (data) => {
  if (!data) return;
  if (data.roundId) roundEl.textContent = "ROUND " + data.roundId;
  if (data.phase === "countdown" && data.countdown != null) {
    timerEl.textContent = data.countdown;
  }
});
</script>
</body>
</html>
