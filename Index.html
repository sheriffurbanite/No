<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO-GEN</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #202020, #080808 65%);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: min(430px, 94vw);
    background: #101010;
    border: 1px solid #292929;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #aaa;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #777;
}

.dot.online {
    background: #20e080;
    box-shadow: 0 0 12px #20e080;
}

/* ========== SIGNAL SECTION ========== */
.signal-box {
    background: #171717;
    border: 1px solid #252525;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
    text-align: center;
}

.signal-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 8px;
}

.signal-value {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
}

/* ========== RUNNING SECTION ========== */
.display {
    min-height: 200px;
    border-radius: 20px;
    background: linear-gradient(145deg, #171717, #0c0c0c);
    border: 1px solid #252525;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
}

.phase {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #777;
    margin-bottom: 10px;
}

.multiplier {
    font-size: clamp(52px, 15vw, 78px);
    font-weight: 900;
    line-height: 1;
    transition: .12s ease;
}

.multiplier.running {
    transform: scale(1.02);
}

.countdown {
    margin-top: 16px;
    font-size: 34px;
    font-weight: 800;
}

button {
    width: 100%;
    border: 0;
    border-radius: 15px;
    padding: 15px;
    background: #fff;
    color: #000;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none;
}

.message {
    margin-top: 15px;
    min-height: 20px;
    text-align: center;
    font-size: 12px;
    color: #777;
}

.round-id {
    margin-top: 12px;
    text-align: center;
    color: #444;
    font-size: 10px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">NO-GEN</div>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <!-- SIGNAL SECTION -->
    <div class="signal-box">
        <div class="signal-label">Signal</div>
        <div class="signal-value" id="prediction">—</div>
    </div>

    <!-- RUNNING SECTION -->
    <div class="display">
        <div class="phase" id="phase">WAITING</div>
        <div class="multiplier" id="multiplier">1.00x</div>
        <div class="countdown" id="countdown"></div>
    </div>

    <button id="requestBtn">REQUEST SIGNAL</button>

    <div class="message" id="message">Waiting for server...</div>
    <div class="round-id" id="roundId">NO ACTIVE ROUND</div>

</div>

<script>
const BACKEND_URL = "https://no-gen.bonto.run";

const socket = io(BACKEND_URL, {
    transports: ["websocket", "polling"],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000
});

const phaseEl = document.getElementById("phase");
const multiplierEl = document.getElementById("multiplier");
const predictionEl = document.getElementById("prediction");
const countdownEl = document.getElementById("countdown");
const messageEl = document.getElementById("message");
const roundIdEl = document.getElementById("roundId");
const requestBtn = document.getElementById("requestBtn");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

socket.on("connect", () => {
    statusDot.classList.add("online");
    statusText.textContent = "Connected";
    messageEl.textContent = "Connected to authoritative server.";
    socket.emit("get_round_state");
});

socket.on("disconnect", () => {
    statusDot.classList.remove("online");
    statusText.textContent = "Disconnected";
    messageEl.textContent = "Connection lost. Reconnecting...";
});

socket.on("connect_error", () => {
    statusDot.classList.remove("online");
    statusText.textContent = "Connection error";
});

/* Request with fixed range (no min/max UI) */
requestBtn.addEventListener("click", () => {
    requestBtn.disabled = true;
    predictionEl.textContent = "requesting...";
    messageEl.textContent = "Requesting signal from server...";

    socket.emit("request_prediction", {
        min: 1.01,
        max: 100
    });
});

socket.on("prediction_ready", (data) => {
    predictionEl.textContent = data.prediction + "x";
    roundIdEl.textContent = `ROUND ${data.roundId}`;
    phaseEl.textContent = "SIGNAL LOCKED";
    messageEl.textContent = "Signal locked. Waiting for countdown...";
});

socket.on("round_countdown", (data) => {
    phaseEl.textContent = "STARTING";
    countdownEl.textContent = data.seconds;
    multiplierEl.textContent = "1.00x";
    roundIdEl.textContent = `ROUND ${data.roundId}`;
    messageEl.textContent = "Round locked by server.";
    requestBtn.disabled = true;
});

socket.on("round_started", (data) => {
    phaseEl.textContent = "LIVE";
    countdownEl.textContent = "";
    multiplierEl.textContent = "1.00x";
    multiplierEl.classList.add("running");
    roundIdEl.textContent = `ROUND ${data.roundId}`;
    messageEl.textContent = "Live round running...";
});

socket.on("round_update", (data) => {
    // Client never calculates — only displays server value
    multiplierEl.textContent = Number(data.multiplier).toFixed(2) + "x";
    phaseEl.textContent = "LIVE";
});

socket.on("round_ended", (data) => {
    multiplierEl.classList.remove("running");
    multiplierEl.textContent = Number(data.multiplier).toFixed(2) + "x";
    phaseEl.textContent = "CRASHED";
    predictionEl.textContent = Number(data.prediction).toFixed(2) + "x";
    messageEl.textContent = "Round completed.";
    roundIdEl.textContent = `ROUND ${data.roundId}`;
});

socket.on("round_state", (data) => {
    if (!data || !data.phase) return;

    roundIdEl.textContent = data.roundId ? `ROUND ${data.roundId}` : "NO ACTIVE ROUND";

    if (data.phase === "idle") {
        phaseEl.textContent = "WAITING";
        multiplierEl.textContent = "1.00x";
        countdownEl.textContent = "";
        requestBtn.disabled = false;
        return;
    }

    if (data.phase === "countdown") {
        phaseEl.textContent = "STARTING";
        multiplierEl.textContent = "1.00x";
        if (data.countdown !== undefined) countdownEl.textContent = data.countdown;
        requestBtn.disabled = true;
        return;
    }

    if (data.phase === "running") {
        phaseEl.textContent = "LIVE";
        multiplierEl.textContent = Number(data.multiplier).toFixed(2) + "x";
        requestBtn.disabled = true;
        return;
    }

    if (data.phase === "ended") {
        phaseEl.textContent = "CRASHED";
        multiplierEl.textContent = Number(data.multiplier).toFixed(2) + "x";
        requestBtn.disabled = true;
        if (data.prediction !== undefined) {
            predictionEl.textContent = Number(data.prediction).toFixed(2) + "x";
        }
    }
});

socket.on("round_reset", () => {
    phaseEl.textContent = "WAITING";
    multiplierEl.textContent = "1.00x";
    multiplierEl.classList.remove("running");
    predictionEl.textContent = "—";
    countdownEl.textContent = "";
    messageEl.textContent = "Ready for the next round.";
    roundIdEl.textContent = "NO ACTIVE ROUND";
    requestBtn.disabled = false;
});

socket.on("prediction_error", (data) => {
    requestBtn.disabled = false;
    messageEl.textContent = data?.message || "Signal request failed.";
});
</script>

</body>
</html>
