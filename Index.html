<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO-GEN</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #202020, #080808 65%);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: min(430px, 94vw);
    background: #101010;
    border: 1px solid #292929;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #aaa;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #777;
}

.dot.online {
    background: #20e080;
    box-shadow: 0 0 12px #20e080;
}

.display {
    min-height: 240px;
    border-radius: 20px;
    background:
        linear-gradient(145deg, #171717, #0c0c0c);
    border: 1px solid #252525;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
    overflow: hidden;
}

.phase {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #777;
    margin-bottom: 10px;
}

.multiplier {
    font-size: clamp(52px, 15vw, 78px);
    font-weight: 900;
    line-height: 1;
    transition: .12s ease;
}

.multiplier.running {
    transform: scale(1.02);
}

.prediction {
    margin-top: 18px;
    font-size: 14px;
    color: #aaa;
}

.prediction strong {
    color: #fff;
}

.countdown {
    margin-top: 16px;
    font-size: 34px;
    font-weight: 800;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.input-box {
    background: #181818;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 12px;
}

.input-box label {
    display: block;
    color: #777;
    font-size: 11px;
    margin-bottom: 5px;
}

.input-box input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    font-size: 16px;
}

button {
    grid-column: 1 / -1;
    border: 0;
    border-radius: 15px;
    padding: 15px;
    background: #fff;
    color: #000;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none;
}

.message {
    margin-top: 15px;
    min-height: 20px;
    text-align: center;
    font-size: 12px;
    color: #777;
}

.round-id {
    margin-top: 12px;
    text-align: center;
    color: #444;
    font-size: 10px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">NO-GEN</div>

        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="display">

        <div class="phase" id="phase">
            WAITING
        </div>

        <div class="multiplier" id="multiplier">
            1.00x
        </div>

        <div class="prediction" id="prediction">
            Prediction: —
        </div>

        <div class="countdown" id="countdown"></div>

    </div>

    <div class="controls">

        <div class="input-box">
            <label>MIN</label>
            <input
                id="min"
                type="number"
                value="1.01"
                min="1.01"
                step="0.01"
            >
        </div>

        <div class="input-box">
            <label>MAX</label>
            <input
                id="max"
                type="number"
                value="100"
                min="1.01"
                step="0.01"
            >
        </div>

        <button id="requestBtn">
            REQUEST PREDICTION
        </button>

    </div>

    <div class="message" id="message">
        Waiting for server...
    </div>

    <div class="round-id" id="roundId">
        NO ACTIVE ROUND
    </div>

</div>

<script>

/*
==================================================
 BACKEND
==================================================
*/

const BACKEND_URL = "https://no-gen.bonto.run";

const socket = io(BACKEND_URL, {
    transports: ["websocket", "polling"],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000
});


/*
==================================================
 DOM
==================================================
*/

const phaseEl = document.getElementById("phase");
const multiplierEl = document.getElementById("multiplier");
const predictionEl = document.getElementById("prediction");
const countdownEl = document.getElementById("countdown");
const messageEl = document.getElementById("message");
const roundIdEl = document.getElementById("roundId");

const requestBtn = document.getElementById("requestBtn");
const minInput = document.getElementById("min");
const maxInput = document.getElementById("max");

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");


/*
==================================================
 CONNECTION
==================================================
*/

socket.on("connect", () => {

    statusDot.classList.add("online");
    statusText.textContent = "Connected";

    messageEl.textContent =
        "Connected to authoritative server.";

    socket.emit("get_round_state");
});


socket.on("disconnect", () => {

    statusDot.classList.remove("online");
    statusText.textContent = "Disconnected";

    messageEl.textContent =
        "Connection lost. Reconnecting...";
});


socket.on("connect_error", () => {

    statusDot.classList.remove("online");
    statusText.textContent = "Connection error";
});


/*
==================================================
 REQUEST PREDICTION
==================================================
*/

requestBtn.addEventListener("click", () => {

    const min = Number(minInput.value);
    const max = Number(maxInput.value);

    if (!Number.isFinite(min) ||
        !Number.isFinite(max) ||
        min < 1.01 ||
        max <= min) {

        messageEl.textContent =
            "Enter a valid minimum and maximum.";

        return;
    }

    requestBtn.disabled = true;

    predictionEl.innerHTML =
        "Prediction: <strong>requesting...</strong>";

    messageEl.textContent =
        "Requesting prediction from server...";

    socket.emit("request_prediction", {
        min,
        max
    });
});


/*
==================================================
 PREDICTION RECEIVED
==================================================
*/

socket.on("prediction_ready", (data) => {

    predictionEl.innerHTML =
        `Prediction: <strong>${data.prediction}x</strong>`;

    roundIdEl.textContent =
        `ROUND ${data.roundId}`;

    phaseEl.textContent =
        "PREDICTION LOCKED";

    messageEl.textContent =
        "Prediction locked. Waiting for countdown...";

    /*
     * Do NOT create a local timer here.
     *
     * The server controls the round.
     */
});


/*
==================================================
 COUNTDOWN
==================================================
*/

socket.on("round_countdown", (data) => {

    phaseEl.textContent = "STARTING";

    countdownEl.textContent =
        data.seconds;

    multiplierEl.textContent =
        "1.00x";

    roundIdEl.textContent =
        `ROUND ${data.roundId}`;

    messageEl.textContent =
        "Round locked by server.";

    requestBtn.disabled = true;
});


/*
==================================================
 ROUND STARTED
==================================================
*/

socket.on("round_started", (data) => {

    phaseEl.textContent =
        "LIVE";

    countdownEl.textContent = "";

    multiplierEl.textContent =
        "1.00x";

    multiplierEl.classList.add("running");

    roundIdEl.textContent =
        `ROUND ${data.roundId}`;

    messageEl.textContent =
        "Live round running...";
});


/*
==================================================
 LIVE SERVER UPDATE
==================================================
*/

socket.on("round_update", (data) => {

    /*
     * The client NEVER calculates the multiplier.
     *
     * It simply displays the authoritative
     * value received from Socket.IO.
     */

    multiplierEl.textContent =
        Number(data.multiplier).toFixed(2) + "x";

    phaseEl.textContent =
        "LIVE";
});


/*
==================================================
 ROUND ENDED
==================================================
*/

socket.on("round_ended", (data) => {

    multiplierEl.classList.remove("running");

    multiplierEl.textContent =
        Number(data.multiplier).toFixed(2) + "x";

    phaseEl.textContent =
        "CRASHED";

    predictionEl.innerHTML =
        `Prediction: <strong>${Number(data.prediction).toFixed(2)}x</strong>`;

    messageEl.textContent =
        "Round completed.";

    roundIdEl.textContent =
        `ROUND ${data.roundId}`;

});


/*
==================================================
 ROUND STATE SYNC
==================================================
*/

socket.on("round_state", (data) => {

    if (!data || !data.phase) return;

    roundIdEl.textContent =
        data.roundId
            ? `ROUND ${data.roundId}`
            : "NO ACTIVE ROUND";

    if (data.phase === "idle") {

        phaseEl.textContent =
            "WAITING";

        multiplierEl.textContent =
            "1.00x";

        countdownEl.textContent = "";

        requestBtn.disabled = false;

        return;
    }

    if (data.phase === "countdown") {

        phaseEl.textContent =
            "STARTING";

        multiplierEl.textContent =
            "1.00x";

        if (data.countdown !== undefined) {
            countdownEl.textContent =
                data.countdown;
        }

        requestBtn.disabled = true;

        return;
    }

    if (data.phase === "running") {

        phaseEl.textContent =
            "LIVE";

        multiplierEl.textContent =
            Number(data.multiplier).toFixed(2) + "x";

        requestBtn.disabled = true;

        return;
    }

    if (data.phase === "ended") {

        phaseEl.textContent =
            "CRASHED";

        multiplierEl.textContent =
            Number(data.multiplier).toFixed(2) + "x";

        requestBtn.disabled = true;

        if (data.prediction !== undefined) {

            predictionEl.innerHTML =
                `Prediction: <strong>${Number(data.prediction).toFixed(2)}x</strong>`;
        }
    }
});


/*
==================================================
 ROUND RESET
==================================================
*/

socket.on("round_reset", () => {

    phaseEl.textContent =
        "WAITING";

    multiplierEl.textContent =
        "1.00x";

    multiplierEl.classList.remove("running");

    predictionEl.textContent =
        "Prediction: —";

    countdownEl.textContent = "";

    messageEl.textContent =
        "Ready for the next round.";

    roundIdEl.textContent =
        "NO ACTIVE ROUND";

    requestBtn.disabled = false;
});


/*
==================================================
 ERRORS
==================================================
*/

socket.on("prediction_error", (data) => {

    requestBtn.disabled = false;

    messageEl.textContent =
        data?.message || "Prediction request failed.";
});


</script>

</body>
</html>
