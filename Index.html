<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>No-Gen | Real-Time Engine</title>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #172554 0,
          #080b14 45%,
          #03040a 100%
        );

      color: #fff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }


    .app {
      width: 100%;
      max-width: 480px;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }


    .logo {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      font-size: 20px;
      font-weight: 900;

      box-shadow:
        0 8px 30px
        rgba(37, 99, 235, .3);
    }


    .brand h1 {
      font-size: 20px;
      letter-spacing: -.5px;
    }


    .brand p {
      color: #8f9bb5;
      font-size: 11px;
      margin-top: 2px;
    }


    /* =========================
       CONNECTION
    ========================= */

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 7px 10px;

      border: 1px solid
        rgba(255,255,255,.08);

      border-radius: 20px;

      background:
        rgba(255,255,255,.04);

      font-size: 11px;
      color: #9ca3af;
    }


    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }


    .connection.online .status-dot {
      background: #22c55e;
      box-shadow:
        0 0 10px
        rgba(34,197,94,.7);
    }


    .connection.offline .status-dot {
      background: #ef4444;
    }


    /* =========================
       MAIN GAME CARD
    ========================= */

    .game-card {
      position: relative;

      overflow: hidden;

      border-radius: 25px;

      padding: 25px 18px 20px;

      background:
        linear-gradient(
          145deg,
          rgba(18,25,45,.96),
          rgba(7,10,20,.98)
        );

      border:
        1px solid
        rgba(255,255,255,.08);

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.45);
    }


    .game-card::before {
      content: "";

      position: absolute;

      width: 250px;
      height: 250px;

      top: -150px;
      left: 50%;

      transform: translateX(-50%);

      background:
        rgba(59,130,246,.18);

      filter: blur(60px);

      pointer-events: none;
    }


    .phase {
      position: relative;

      text-align: center;

      color: #94a3b8;

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 2px;

      margin-bottom: 12px;
    }


    .multiplier {
      position: relative;

      text-align: center;

      font-size: clamp(58px, 18vw, 90px);

      font-weight: 900;

      letter-spacing: -5px;

      line-height: 1;

      margin: 10px 0 18px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #93c5fd
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      transition:
        transform .15s ease;
    }


    .multiplier.running {
      transform: scale(1.02);
    }


    /* =========================
       TIMER
    ========================= */

    .timer-box {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 55px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid
        rgba(255,255,255,.07);

      margin-bottom: 18px;
    }


    .timer {
      font-size: 24px;
      font-weight: 800;
    }


    /* =========================
       ROUND ID
    ========================= */

    .round-info {
      display: flex;
      justify-content: space-between;

      gap: 10px;

      font-size: 10px;

      color: #64748b;

      margin-bottom: 18px;
    }


    .round-id {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }


    /* =========================
       NUMBER GENERATOR
    ========================= */

    .generator {
      margin-top: 10px;

      padding-top: 18px;

      border-top:
        1px solid
        rgba(255,255,255,.07);
    }


    .generator-title {
      font-size: 13px;
      font-weight: 700;

      margin-bottom: 12px;

      color: #dbeafe;
    }


    .inputs {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-bottom: 10px;
    }


    .input-group label {
      display: block;

      font-size: 10px;

      color: #64748b;

      margin-bottom: 5px;
    }


    input {
      width: 100%;

      padding: 13px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255,255,255,.08);

      outline: none;

      background:
        rgba(0,0,0,.25);

      color: white;

      font-size: 14px;
    }


    input:focus {
      border-color: #3b82f6;
    }


    .generate-btn {
      width: 100%;

      border: none;

      border-radius: 13px;

      padding: 14px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      color: white;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }


    .generate-btn:hover {
      transform: translateY(-1px);
    }


    .generate-btn:active {
      transform: scale(.98);
    }


    .generate-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }


    /* =========================
       RESULT
    ========================= */

    .result-box {
      margin-top: 12px;

      padding: 17px;

      border-radius: 15px;

      background:
        rgba(37,99,235,.08);

      border:
        1px solid
        rgba(59,130,246,.15);

      text-align: center;
    }


    .result-label {
      color: #64748b;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }


    .result {
      font-size: 32px;

      font-weight: 900;

      margin-top: 5px;
    }


    /* =========================
       HISTORY
    ========================= */

    .history-section {
      margin-top: 18px;
    }


    .section-title {
      display: flex;
      justify-content: space-between;

      margin-bottom: 9px;

      font-size: 12px;

      color: #94a3b8;
    }


    .history {
      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding-bottom: 3px;

      scrollbar-width: none;
    }


    .history::-webkit-scrollbar {
      display: none;
    }


    .history-item {
      flex: 0 0 auto;

      min-width: 70px;

      padding: 10px;

      text-align: center;

      border-radius: 11px;

      background:
        rgba(255,255,255,.04);

      border:
        1px solid
        rgba(255,255,255,.06);
    }


    .history-item strong {
      display: block;

      font-size: 13px;
    }


    .history-item small {
      display: block;

      margin-top: 3px;

      font-size: 8px;

      color: #64748b;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;

      color: #475569;

      font-size: 9px;

      margin-top: 16px;
    }


    /* =========================
       ANIMATION
    ========================= */

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: .55;
      }
    }


    .pulse {
      animation:
        pulse 1s infinite;
    }


    @media (max-width: 380px) {

      body {
        padding: 12px;
      }

      .game-card {
        padding: 20px 14px;
      }

      .multiplier {
        font-size: 58px;
      }

    }

  </style>

</head>


<body>

  <main class="app">


    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <div class="logo">
          NG
        </div>

        <div>
          <h1>No-Gen</h1>
          <p>Real-Time Number Engine</p>
        </div>

      </div>


      <div
        id="connection"
        class="connection"
      >

        <span class="status-dot"></span>

        <span id="connectionText">
          Connecting...
        </span>

      </div>

    </header>


    <!-- GAME -->

    <section class="game-card">


      <div
        id="roundPhase"
        class="phase"
      >
        CONNECTING
      </div>


      <div
        id="multiplier"
        class="multiplier"
      >
        1.00x
      </div>


      <div class="timer-box">

        <div
          id="timer"
          class="timer"
        >
          --
        </div>

      </div>


      <div class="round-info">

        <span>
          ROUND
        </span>

        <span
          id="roundId"
          class="round-id"
        >
          Waiting...
        </span>

      </div>


      <!-- NUMBER GENERATOR -->

      <div class="generator">

        <div class="generator-title">
          Random Number Generator
        </div>


        <div class="inputs">

          <div class="input-group">

            <label for="min">
              MINIMUM
            </label>

            <input
              id="min"
              type="number"
              value="1"
            >

          </div>


          <div class="input-group">

            <label for="max">
              MAXIMUM
            </label>

            <input
              id="max"
              type="number"
              value="100"
            >

          </div>

        </div>


        <button
          id="generateBtn"
          class="generate-btn"
          type="button"
        >
          GENERATE NUMBER
        </button>


        <div class="result-box">

          <div class="result-label">
            Latest Result
          </div>

          <div
            id="result"
            class="result"
          >
            —
          </div>

        </div>

      </div>


    </section>


    <!-- ROUND HISTORY -->

    <section class="history-section">

      <div class="section-title">

        <span>
          Recent Rounds
        </span>

        <span>
          LIVE
        </span>

      </div>


      <div
        id="history"
        class="history"
      >
      </div>

    </section>


    <div class="footer">
      No-Gen • Socket.IO Real-Time Engine
    </div>


  </main>


  <script>

    /* =====================================================
       CONFIGURATION
    ===================================================== */

    const BACKEND_URL =
      "https://no-gen.bonto.run";


    /* =====================================================
       SOCKET CONNECTION
    ===================================================== */

    const socket = io(
      BACKEND_URL,
      {
        transports: [
          "websocket",
          "polling"
        ],

        reconnection: true,

        reconnectionAttempts: Infinity,

        reconnectionDelay: 1000,

        reconnectionDelayMax: 5000
      }
    );


    /* =====================================================
       STATE
    ===================================================== */

    let connected = false;

    let phase = "connecting";

    let roundId = null;

    let multiplier = 1.00;

    let countdown = 5;

    let roundHistory = [];


    /* =====================================================
       DOM
    ===================================================== */

    const connection =
      document.getElementById(
        "connection"
      );

    const connectionText =
      document.getElementById(
        "connectionText"
      );

    const phaseElement =
      document.getElementById(
        "roundPhase"
      );

    const multiplierElement =
      document.getElementById(
        "multiplier"
      );

    const timerElement =
      document.getElementById(
        "timer"
      );

    const roundIdElement =
      document.getElementById(
        "roundId"
      );

    const generateButton =
      document.getElementById(
        "generateBtn"
      );

    const minInput =
      document.getElementById(
        "min"
      );

    const maxInput =
      document.getElementById(
        "max"
      );

    const resultElement =
      document.getElementById(
        "result"
      );

    const historyElement =
      document.getElementById(
        "history"
      );


    /* =====================================================
       CONNECTION
    ===================================================== */

    socket.on("connect", () => {

      connected = true;

      connection.classList.add(
        "online"
      );

      connection.classList.remove(
        "offline"
      );

      connectionText.textContent =
        "Connected";

      console.log(
        "Connected:",
        socket.id
      );

    });


    socket.on("disconnect", () => {

      connected = false;

      connection.classList.remove(
        "online"
      );

      connection.classList.add(
        "offline"
      );

      connectionText.textContent =
        "Disconnected";

      console.log(
        "Socket disconnected"
      );

    });


    socket.on(
      "connect_error",
      (error) => {

        connected = false;

        connection.classList.remove(
          "online"
        );

        connection.classList.add(
          "offline"
        );

        connectionText.textContent =
          "Connection error";

        console.error(
          error
        );

      }
    );


    /* =====================================================
       SERVER STATUS
    ===================================================== */

    socket.on(
      "server_status",
      (data) => {

        console.log(
          "Server:",
          data
        );

      }
    );


    /* =====================================================
       CURRENT STATE
    ===================================================== */

    socket.on(
      "round_state",
      (data) => {

        if (!data) return;

        phase =
          data.phase || "waiting";

        roundId =
          data.roundId || null;

        countdown =
          Number(data.seconds) || 0;

        multiplier =
          Number(data.multiplier) || 1;

        updateUI();

      }
    );


    /* =====================================================
       COUNTDOWN
    ===================================================== */

    socket.on(
      "round_countdown",
      (data) => {

        phase = "countdown";

        roundId =
          data.roundId;

        countdown =
          Number(data.seconds);

        multiplier = 1.00;

        updateUI();

      }
    );


    /* =====================================================
       ROUND STARTED
    ===================================================== */

    socket.on(
      "round_started",
      (data) => {

        phase = "running";

        roundId =
          data.roundId;

        multiplier =
          Number(data.multiplier) || 1;

        updateUI();

      }
    );


    /* =====================================================
       LIVE MULTIPLIER
    ===================================================== */

    socket.on(
      "round_update",
      (data) => {

        if (!data) return;

        phase = "running";

        roundId =
          data.roundId;

        multiplier =
          Number(data.multiplier) || 1;

        updateUI();

      }
    );


    /* =====================================================
       ROUND ENDED
    ===================================================== */

    socket.on(
      "round_ended",
      (data) => {

        phase = "ended";

        roundId =
          data.roundId;

        multiplier =
          Number(data.multiplier) || 1;

        addRoundHistory(
          roundId,
          multiplier
        );

        updateUI();

      }
    );


    /* =====================================================
       NUMBER GENERATION
    ===================================================== */

    generateButton.addEventListener(
      "click",
      generateNumber
    );


    function generateNumber() {

      if (!connected) {

        resultElement.textContent =
          "OFFLINE";

        return;
      }


      const min =
        Number(minInput.value);

      const max =
        Number(maxInput.value);


      if (
        !Number.isInteger(min) ||
        !Number.isInteger(max)
      ) {

        resultElement.textContent =
          "INVALID";

        return;
      }


      if (min > max) {

        resultElement.textContent =
          "ERROR";

        return;
      }


      /*
        Generation remains available independently
        from the simulated round engine.
      */

      generateButton.disabled =
        true;

      generateButton.textContent =
        "GENERATING...";


      socket.emit(
        "generate_number",
        {
          min,
          max
        }
      );

    }


    /* =====================================================
       NUMBER GENERATED
    ===================================================== */

    socket.on(
      "number_generated",
      (data) => {

        resultElement.textContent =
          data.number;

        generateButton.disabled =
          false;

        generateButton.textContent =
          "GENERATE NUMBER";

      }
    );


    /* =====================================================
       GENERATION ERROR
    ===================================================== */

    socket.on(
      "generation_error",
      (data) => {

        resultElement.textContent =
          "ERROR";

        generateButton.disabled =
          false;

        generateButton.textContent =
          "GENERATE NUMBER";

        console.error(
          data?.message
        );

      }
    );


    /* =====================================================
       UI UPDATE
    ===================================================== */

    function updateUI() {

      /*
        Phase
      */

      if (phase === "countdown") {

        phaseElement.textContent =
          "NEXT ROUND";

        phaseElement.classList.add(
          "pulse"
        );

        timerElement.textContent =
          `${countdown}s`;

        multiplierElement.textContent =
          "1.00x";

      }


      else if (phase === "running") {

        phaseElement.textContent =
          "RUNNING";

        phaseElement.classList.remove(
          "pulse"
        );

        timerElement.textContent =
          "LIVE";

        multiplierElement.textContent =
          `${multiplier.toFixed(2)}x`;

        multiplierElement.classList.add(
          "running"
        );

      }


      else if (phase === "ended") {

        phaseElement.textContent =
          "ROUND ENDED";

        phaseElement.classList.remove(
          "pulse"
        );

        timerElement.textContent =
          "WAITING";

        multiplierElement.textContent =
          `${multiplier.toFixed(2)}x`;

        multiplierElement.classList.remove(
          "running"
        );

      }


      else {

        phaseElement.textContent =
          "CONNECTING";

        timerElement.textContent =
          "--";

      }


      /*
        Round ID
      */

      if (roundId) {

        roundIdElement.textContent =
          roundId.substring(0, 12);

      } else {

        roundIdElement.textContent =
          "Waiting...";

      }

    }


    /* =====================================================
       HISTORY
    ===================================================== */

    function addRoundHistory(
      id,
      value
    ) {

      roundHistory.unshift({
        id,
        value
      });


      if (
        roundHistory.length > 12
      ) {

        roundHistory.pop();

      }


      renderHistory();

    }


    function renderHistory() {

      historyElement.innerHTML = "";


      roundHistory.forEach(
        (item) => {

          const element =
            document.createElement(
              "div"
            );

          element.className =
            "history-item";


          element.innerHTML = `
            <strong>
              ${Number(item.value).toFixed(2)}x
            </strong>

            <small>
              ${item.id.substring(0, 6)}
            </small>
          `;


          historyElement.appendChild(
            element
          );

        }
      );

    }


    /* =====================================================
       ENTER KEY
    ===================================================== */

    minInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          generateNumber();

        }

      }
    );


    maxInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          generateNumber();

        }

      }
    );


    /* =====================================================
       INITIAL UI
    ===================================================== */

    updateUI();

    console.log(
      "No-Gen frontend initialized."
    );

    console.log(
      "Backend:",
      BACKEND_URL
    );

  </script>

</body>

</html>
