<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO-GEN</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1c1c1c, #070707 70%);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: min(430px, 94vw);
    background: #0f0f0f;
    border: 1px solid #2a2a2a;
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 25px 70px rgba(0,0,0,.5);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #999;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
}

.dot.online {
    background: #22e080;
    box-shadow: 0 0 12px #22e080;
}

/* SIGNAL BOX */
.signal-box {
    background: #161616;
    border: 1px solid #2c2c2c;
    border-radius: 18px;
    padding: 16px;
    text-align: center;
    margin-bottom: 14px;
}

.signal-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 6px;
}

.signal-value {
    font-size: 30px;
    font-weight: 900;
    color: #fff;
}

/* MAIN DISPLAY */
.display {
    min-height: 220px;
    border-radius: 20px;
    background: linear-gradient(160deg, #171717, #0b0b0b);
    border: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
}

.phase {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 12px;
}

.multiplier {
    font-size: clamp(56px, 16vw, 82px);
    font-weight: 900;
    line-height: 1;
    transition: transform 0.1s ease;
}

.multiplier.running {
    transform: scale(1.04);
    color: #7dffb3;
}

.countdown {
    margin-top: 14px;
    font-size: 36px;
    font-weight: 800;
    color: #fff;
}

.guide {
    margin-top: 10px;
    font-size: 13px;
    color: #888;
    text-align: center;
    max-width: 90%;
}

button {
    width: 100%;
    border: 0;
    border-radius: 15px;
    padding: 16px;
    background: #fff;
    color: #000;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    transition: 0.2s;
}

button:hover { transform: translateY(-1px); }
button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
}

.message {
    margin-top: 14px;
    text-align: center;
    font-size: 13px;
    color: #888;
    min-height: 20px;
}

.round-id {
    margin-top: 10px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: #444;
}
</style>
</head>
<body>

<div class="app">

    <div class="header">
        <div class="logo">NO-GEN</div>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <!-- SIGNAL (shown before the climb) -->
    <div class="signal-box">
        <div class="signal-label">Your Signal</div>
        <div class="signal-value" id="prediction">—</div>
    </div>

    <!-- RUNNING AREA -->
    <div class="display">
        <div class="phase" id="phase">WAITING</div>
        <div class="multiplier" id="multiplier">1.00x</div>
        <div class="countdown" id="countdown"></div>
        <div class="guide" id="guide">
            Press the button to request a signal
        </div>
    </div>

    <button id="requestBtn">REQUEST SIGNAL</button>

    <div class="message" id="message">Waiting for server...</div>
    <div class="round-id" id="roundId">NO ACTIVE ROUND</div>

</div>

<script>
const BACKEND_URL = "https://no-gen.bonto.run";

const socket = io(BACKEND_URL, {
    transports: ["websocket", "polling"],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000
});

const phaseEl      = document.getElementById("phase");
const multiplierEl = document.getElementById("multiplier");
const predictionEl = document.getElementById("prediction");
const countdownEl  = document.getElementById("countdown");
const guideEl      = document.getElementById("guide");
const messageEl    = document.getElementById("message");
const roundIdEl    = document.getElementById("roundId");
const requestBtn   = document.getElementById("requestBtn");
const statusDot    = document.getElementById("statusDot");
const statusText   = document.getElementById("statusText");

function setGuide(text) {
    guideEl.textContent = text;
}

socket.on("connect", () => {
    statusDot.classList.add("online");
    statusText.textContent = "Connected";
    messageEl.textContent = "Connected to server";
    setGuide("Press the button to request a signal");
    socket.emit("get_round_state");
});

socket.on("disconnect", () => {
    statusDot.classList.remove("online");
    statusText.textContent = "Disconnected";
    messageEl.textContent = "Connection lost. Reconnecting...";
});

socket.on("connect_error", () => {
    statusDot.classList.remove("online");
    statusText.textContent = "Connection error";
});

/* Request signal (fixed range, no min/max UI) */
requestBtn.addEventListener("click", () => {
    requestBtn.disabled = true;
    predictionEl.textContent = "...";
    messageEl.textContent = "Requesting signal...";
    setGuide("Waiting for server to lock your signal");

    socket.emit("request_prediction", {
        min: 1.01,
        max: 100
    });
});

/* Signal locked BEFORE the round starts climbing */
socket.on("prediction_ready", (data) => {
    predictionEl.textContent = data.prediction + "x";
    roundIdEl.textContent = "ROUND " + data.roundId;
    phaseEl.textContent = "SIGNAL LOCKED";
    messageEl.textContent = "Signal locked by server";
    setGuide("Your signal is ready. Round will start soon...");
});

/* Countdown – guide the player that the round is about to begin */
socket.on("round_countdown", (data) => {
    phaseEl.textContent = "STARTING";
    countdownEl.textContent = data.seconds;
    multiplierEl.textContent = "1.00x";
    multiplierEl.classList.remove("running");
    roundIdEl.textContent = "ROUND " + data.roundId;
    messageEl.textContent = "Round is about to begin";
    setGuide("Round starts in " + data.seconds + " seconds");
    requestBtn.disabled = true;
});

/* Live climb begins */
socket.on("round_started", (data) => {
    phaseEl.textContent = "LIVE";
    countdownEl.textContent = "";
    multiplierEl.textContent = "1.00x";
    multiplierEl.classList.add("running");
    roundIdEl.textContent = "ROUND " + data.roundId;
    messageEl.textContent = "Round is live";
    setGuide("Multiplier is climbing...");
});

/* Live updates from server only */
socket.on("round_update", (data) => {
    multiplierEl.textContent = Number(data.multiplier).toFixed(2) + "x";
    phaseEl.textContent = "LIVE";
    setGuide("Multiplier is climbing...");
});

/* Round ends at the locked prediction */
socket.on("round_ended", (data) => {
    multiplierEl.classList.remove("running");
    multiplierEl.textContent = Number(data.multiplier).toFixed(2) + "x";
    phaseEl.textContent = "CRASHED";
    predictionEl.textContent = Number(data.prediction).toFixed(2) + "x";
    messageEl.textContent = "Round finished";
    setGuide("Crashed at " + Number(data.prediction).toFixed(2) + "x");
    roundIdEl.textContent = "ROUND " + data.roundId;
});

/* Sync when joining mid-round */
socket.on("round_state", (data) => {
    if (!data || !data.phase) return;

    roundIdEl.textContent = data.roundId ? "ROUND " + data.roundId : "NO ACTIVE ROUND";

    if (data.phase === "idle") {
        phaseEl.textContent = "WAITING";
        multiplierEl.textContent = "1.00x";
        countdownEl.textContent = "";
        requestBtn.disabled = false;
        setGuide("Press the button to request a signal");
        return;
    }

    if (data.phase === "countdown") {
        phaseEl.textContent = "STARTING";
        multiplierEl.textContent = "1.00x";
        if (data.countdown !== undefined) {
            countdownEl.textContent = data.countdown;
            setGuide("Round starts in " + data.countdown + " seconds");
        }
        requestBtn.disabled = true;
        return;
    }

    if (data.phase === "running") {
        phaseEl.textContent = "LIVE";
        multiplierEl.textContent = Number(data.multiplier).toFixed(2) + "x";
        multiplierEl.classList.add("running");
        setGuide("Multiplier is climbing...");
        requestBtn.disabled = true;
        return;
    }

    if (data.phase === "ended") {
        phaseEl.textContent = "CRASHED";
        multiplierEl.textContent = Number(data.multiplier).toFixed(2) + "x";
        multiplierEl.classList.remove("running");
        requestBtn.disabled = true;
        if (data.prediction !== undefined) {
            predictionEl.textContent = Number(data.prediction).toFixed(2) + "x";
            setGuide("Crashed at " + Number(data.prediction).toFixed(2) + "x");
        }
    }
});

/* Reset for next round */
socket.on("round_reset", () => {
    phaseEl.textContent = "WAITING";
    multiplierEl.textContent = "1.00x";
    multiplierEl.classList.remove("running");
    predictionEl.textContent = "—";
    countdownEl.textContent = "";
    messageEl.textContent = "Ready for next round";
    roundIdEl.textContent = "NO ACTIVE ROUND";
    requestBtn.disabled = false;
    setGuide("Press the button to request a signal");
});

socket.on("prediction_error", (data) => {
    requestBtn.disabled = false;
    messageEl.textContent = data?.message || "Could not get signal";
    setGuide("Try again when the round is free");
});
</script>
</body>
</html>
