<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>No-Gen | Random Number Generator</title>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #172033 0%, #080b12 45%, #05070b 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: rgba(16, 21, 32, 0.94);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.45);
      backdrop-filter: blur(15px);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: auto;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #377dff, #7c3aed);
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 10px 35px rgba(55,125,255,0.3);
    }

    h1 {
      margin-top: 15px;
      font-size: 24px;
    }

    .subtitle {
      color: #8e98aa;
      font-size: 13px;
      margin-top: 7px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 20px 0;
      color: #9ca6b8;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(245,158,11,0.7);
      transition: 0.3s;
    }

    .connected .dot {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,0.8);
    }

    .number-box {
      min-height: 170px;
      border-radius: 20px;
      background: #090d15;
      border: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .number-box::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      background: rgba(55,125,255,0.12);
      filter: blur(55px);
      border-radius: 50%;
    }

    #number {
      position: relative;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .field {
      background: #0c111b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: #8791a3;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button {
      width: 100%;
      border: none;
      cursor: pointer;
      border-radius: 15px;
      padding: 15px;
      color: white;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, #377dff, #6d4aff);
      box-shadow: 0 12px 25px rgba(55,125,255,0.22);
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .secondary {
      margin-top: 10px;
      background: #111722;
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.08);
      color: #cbd3df;
    }

    .history {
      margin-top: 24px;
    }

    .history-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      color: #9da7b8;
    }

    #historyList {
      max-height: 150px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 7px;
      background: #0c1119;
      border-radius: 10px;
      font-size: 13px;
    }

    .history-item span:last-child {
      color: #5f91ff;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #596477;
      font-size: 10px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .animate {
      animation: pop 0.35s ease;
    }

    @keyframes pop {
      0% {
        transform: scale(0.7);
        opacity: 0;
      }

      70% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .error {
      color: #f87171;
    }
  </style>
</head>

<body>

  <main class="app">
    <section class="card">

      <header class="header">
        <div class="logo">NG</div>

        <h1>No-Gen</h1>

        <p class="subtitle">
          Real-time random number generator
        </p>
      </header>

      <div class="status" id="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>

      <div class="number-box">
        <div id="number">---</div>
      </div>

      <div class="controls">

        <div class="field">
          <label>MINIMUM</label>
          <input
            id="min"
            type="number"
            value="1"
          >
        </div>

        <div class="field">
          <label>MAXIMUM</label>
          <input
            id="max"
            type="number"
            value="100"
          >
        </div>

      </div>

      <button id="generateBtn" disabled>
        CONNECTING...
      </button>

      <button class="secondary" id="clearBtn">
        CLEAR HISTORY
      </button>

      <div class="history">

        <div class="history-title">
          <span>Recent Results</span>
          <span id="count">0</span>
        </div>

        <div id="historyList"></div>

      </div>

      <div class="footer">
        Connected to the No-Gen real-time server.
      </div>

    </section>
  </main>

  <script>

    /*
      IMPORTANT:
      Replace this URL after deploying your backend.

      Example:
      const BACKEND_URL = "https://your-backend.onrender.com";
    */

    const BACKEND_URL = "https://no-gen.bonto.run";

    const socket = io(BACKEND_URL, {
      transports: ["websocket", "polling"]
    });

    const numberElement =
      document.getElementById("number");

    const minInput =
      document.getElementById("min");

    const maxInput =
      document.getElementById("max");

    const generateBtn =
      document.getElementById("generateBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const historyList =
      document.getElementById("historyList");

    const countElement =
      document.getElementById("count");

    const status =
      document.getElementById("status");

    const statusText =
      document.getElementById("statusText");

    let history = [];

    /*
      SOCKET CONNECTED
    */

    socket.on("connect", () => {

      status.classList.add("connected");

      statusText.textContent =
        "Server connected";

      generateBtn.disabled = false;

      generateBtn.textContent =
        "GENERATE NUMBER";

    });


    /*
      SOCKET DISCONNECTED
    */

    socket.on("disconnect", () => {

      status.classList.remove("connected");

      statusText.textContent =
        "Server disconnected";

      generateBtn.disabled = true;

      generateBtn.textContent =
        "SERVER OFFLINE";

    });


    /*
      SERVER STATUS
    */

    socket.on("server_status", (data) => {

      if (data.connected) {

        statusText.textContent =
          "Server connected";

      }

    });


    /*
      NUMBER RECEIVED FROM BACKEND
    */

    socket.on("number_generated", (data) => {

      numberElement.classList.remove("animate");

      void numberElement.offsetWidth;

      numberElement.classList.add("animate");

      numberElement.textContent =
        data.number;

      history.unshift({

        value: data.number,

        time: new Date(
          data.timestamp
        ).toLocaleTimeString()

      });

      if (history.length > 10) {
        history.pop();
      }

      renderHistory();

    });


    /*
      SERVER ERROR
    */

    socket.on("generation_error", (data) => {

      alert(data.message);

    });


    /*
      REQUEST NUMBER FROM SERVER
    */

    function generateNumber() {

      const min =
        Number(minInput.value);

      const max =
        Number(maxInput.value);

      if (!Number.isFinite(min) ||
          !Number.isFinite(max)) {

        alert(
          "Please enter valid numbers."
        );

        return;
      }

      if (min > max) {

        alert(
          "Minimum cannot be greater than maximum."
        );

        return;
      }

      socket.emit(
        "generate_number",
        {
          min: min,
          max: max
        }
      );

    }


    /*
      HISTORY
    */

    function renderHistory() {

      historyList.innerHTML = "";

      history.forEach(item => {

        const row =
          document.createElement("div");

        row.className =
          "history-item";

        row.innerHTML = `
          <span>${item.time}</span>
          <span>${item.value}</span>
        `;

        historyList.appendChild(row);

      });

      countElement.textContent =
        history.length;

    }


    /*
      CLEAR HISTORY
    */

    clearBtn.addEventListener(
      "click",
      () => {

        history = [];

        numberElement.textContent =
          "---";

        renderHistory();

      }
    );


    /*
      GENERATE BUTTON
    */

    generateBtn.addEventListener(
      "click",
      generateNumber
    );


    /*
      ENTER KEY
    */

    [minInput, maxInput].forEach(
      input => {

        input.addEventListener(
          "keydown",
          event => {

            if (
              event.key === "Enter" &&
              !generateBtn.disabled
            ) {

              generateNumber();

            }

          }
        );

      }
    );

  </script>

</body>
            </html>
